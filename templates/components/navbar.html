
<header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">V</span>
        veyra<span class="accent">.</span>
    </a>

    <nav class="nav-links">
        <a href="{{ url_for('home') }}#discover">Discover</a>
        <a href="{{ url_for('home') }}#auctions">
            <span class="live-dot"></span> Live Auctions
        </a>
    </nav>

    <form class="searchbox" action="{{ url_for('home') }}" method="get">
        <span>⌕</span>
        <input type="search" name="q"
               placeholder="Search rare finds..."
               value="{{ request.args.get('q', '') }}">
    </form>

    <div class="nav-actions">
        {% if session.get('user') %}
            <a href="{{ url_for('dashboard') }}">Reminders</a>
            <a class="button small" href="{{ url_for('logout') }}">Log out</a>
            {% else %}
            <a href="{{ url_for('login') }}">Log in</a>
            <a class="button small" href="{{ url_for('register') }}">Join Veyra ↗</a>
        {% endif %}
        
        {% if session.get('user_id') %}
             <a href="{{ url_for('seller_dashboard') }}">Seller Dashboard</a>
            <a href="{{ url_for('my_bids') }}">My Bids</a>
        {% endif %}

    </div>
</header>
